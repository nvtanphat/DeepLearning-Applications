dataset:
  name: Vietnam Vehicle Detection
  source_url: https://universe.roboflow.com/jinkun1998s-workspace/vietnam-vehicle-detection-nt45b
  workspace: jinkun1998s-workspace
  project: vietnam-vehicle-detection-nt45b
  version: 1
  export_format: yolo26
  output_dir: data/vietnam_vehicle_detection
  expected_images: 3376
  expected_classes: 8
  strict_checks: true
  expected_splits:
    train: 2062
    val: 574
    test: 740

experiment:
  imgsz: 640
  epochs: 50
  batch: 4
  seed: 42
  workers: 4
  patience: 15
  device: 0
  cache: false
  optimizer: auto
  lr0: null
  weight_decay: null
  conf: 0.25
  val_conf: 0.001
  iou: 0.70
  benchmark_images: 200
  warmup_images: 20

augmentation:
  hsv_h: 0.015
  hsv_s: 0.50
  hsv_v: 0.30
  degrees: 0.0
  translate: 0.10
  scale: 0.50
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.50
  mosaic: 0.0
  mixup: 0.0

models:
  yolo26:
    family: yolo
    checkpoint: yolo26s.pt
    amp: true
    deterministic: true
    run_name: yolo26s_vn_traffic
  rtdetr:
    family: rtdetr
    checkpoint: rtdetr-l.pt
    amp: false
    deterministic: false
    run_name: rtdetr_l_vn_traffic

paths:
  runs_dir: runs
  reports_dir: artifacts/reports
  predictions_dir: artifacts/predictions
  exports_dir: artifacts/exports

visualization:
  sample_count: 12
  worst_count: 6
  diagnostic_conf: 0.25
  diagnostic_iou: 0.50
